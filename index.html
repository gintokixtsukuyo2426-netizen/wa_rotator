<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menghubungkan ke WhatsApp</title>
<style>
  :root {
    --bg: #f5f7f6;
    --teks: #1d2b25;
    --samar: #5d6b64;
    --hijau: #1a7f4b;
    --hijau-tua: #146339;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121a16;
      --teks: #e8efeb;
      --samar: #9aa8a1;
      --hijau: #35b274;
      --hijau-tua: #4cc68a;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    color: var(--teks);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  main { max-width: 22rem; }
  h1 { margin: 20px 0 8px; font-size: 1.25rem; font-weight: 600; }
  p { margin: 0; color: var(--samar); line-height: 1.5; }
  .putar {
    width: 36px; height: 36px; margin: 0 auto;
    border: 3px solid var(--samar);
    border-top-color: var(--hijau);
    border-radius: 50%;
    animation: putar 0.9s linear infinite;
  }
  .tombol {
    display: inline-block; margin-top: 20px; padding: 12px 22px;
    background: var(--hijau); color: #fff; border-radius: 8px;
    font-weight: 600; text-decoration: none;
  }
  .tombol:hover, .tombol:focus-visible { background: var(--hijau-tua); }
  .tombol:focus-visible { outline: 3px solid var(--hijau); outline-offset: 3px; }
  [hidden] { display: none !important; }
  @keyframes putar { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .putar { animation: none; } }
</style>
</head>
<body>
<main>
  <div class="putar" id="putar" aria-hidden="true"></div>
  <h1 id="judul">Menghubungkan ke WhatsApp…</h1>
  <p id="info">Kamu akan diarahkan ke salah satu admin kami.</p>
  <a class="tombol" id="tombol" hidden>Buka WhatsApp</a>
</main>

<script>
  // === PENGATURAN ===
  // Tempel URL web app dari Apps Script (berakhiran /exec)
  const API_URL = 'https://script.google.com/macros/s/AKfycbzuwu--if6qM-2noPwhKM_llrdYAso4Jn8qRhPL0PSa8mUJgMY5chE5j8vhcoy_DArE/exec';
  // Pesan awal yang otomatis terisi di chat
  const PESAN = 'Halo, saya ingin bertanya.';
  // ==================

  const judul = document.getElementById('judul');
  const info = document.getElementById('info');
  const tombol = document.getElementById('tombol');
  const putar = document.getElementById('putar');

  async function mulai() {
    // Opsional: tambahkan ?src=instagram di link untuk melacak asal klik
    const src = new URLSearchParams(location.search).get('src') || '';

    try {
      const res = await fetch(API_URL + '?src=' + encodeURIComponent(src));
      const data = await res.json();
      if (data.error) throw new Error(data.error);

      const url = 'https://wa.me/' + data.nomor + '?text=' + encodeURIComponent(PESAN);
      tombol.href = url;
      tombol.hidden = false;
      location.replace(url);
    } catch (err) {
      putar.hidden = true;
      judul.textContent = 'Belum bisa terhubung';
      info.textContent = 'Muat ulang halaman ini. Jika masih gagal, hubungi pemilik link.';
    }
  }

  mulai();
</script>
</body>
</html>
